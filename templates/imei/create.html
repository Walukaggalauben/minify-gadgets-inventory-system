{% extends "layout.html" %}

{% block title %}Add IMEI{% endblock %}

{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.bootstrap5.min.css">

<div class="container-fluid">

<div class="card shadow">

<div class="card-header">

<h4>Add IMEI</h4>

</div>

<div class="card-body">

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">

    <label class="form-label">Product Variant</label>

    <select
        name="product_variant_id"
        id="productVariantSelect"
        class="form-select"
        required>

        <option value="">Select Variant</option>

        {% for variant in variants %}

        <option value="{{ variant.id }}">

            {{ variant.product.name }}
            |
            {{ variant.storage or "-" }}
            |
            {{ variant.ram or "-" }}
            |
            {{ variant.colour or "-" }}
            |
            SKU: {{ variant.sku }}

        </option>

        {% endfor %}

    </select>

    <div class="form-text">Search by product name, storage, RAM, colour or SKU.</div>

</div>

<div class="mb-3">

<label>IMEI</label>

<input
type="text"
name="imei"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Serial Number</label>

<input
type="text"
name="serial_number"
class="form-control">

</div>

<div class="mb-3">

<label>Status</label>

<select
name="status"
class="form-select">

<option>In Stock</option>
<option>Reserved</option>
<option>Sold</option>
<option>Returned</option>
<option>Damaged</option>

</select>

</div>

<div class="mb-3">

<label>Notes</label>

<textarea
name="notes"
class="form-control"
rows="4"></textarea>

</div>

<button class="btn btn-primary">

Save IMEI

</button>

<a
href="{{ url_for('imei.index') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const select = document.getElementById("productVariantSelect");
    if (!select) return;
    new TomSelect(select, {
        create: false,
        allowEmptyOption: true,
        maxOptions: null,
        searchField: ["text"],
        placeholder: "Search product variant...",
        closeAfterSelect: true,
    });
});
</script>

{% endblock %}
