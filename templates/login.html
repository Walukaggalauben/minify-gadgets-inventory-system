<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MINIFY GADGETS ERP V2</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .login-card{
            width:420px;
            max-width:100%;
            background:white;
            border-radius:15px;
            padding:40px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        h1{
            color:#00695C;
            text-align:center;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:gray;
            margin-bottom:30px;
        }

        label{
            font-weight:600;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:14px;
            background:#00695C;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#00897B;
        }

        .error{
            background:#ffebee;
            color:#c62828;
            padding:12px;
            border-radius:8px;
            margin-bottom:20px;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>MINIFY GADGETS</h1>

    <p>Enterprise Resource Planning System</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="error">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Username, Phone or Email</label>

        <input
            type="text"
            name="identifier"
            autocomplete="username"
            placeholder="Enter username, phone or email"
            required>

        <label>Password</label>

        <input
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Enter password"
            required>

        <button type="submit">
            Login
        </button>

        <div style="text-align:center;margin-top:18px;">
            <a href="{{ url_for('auth.forgot_password') }}" style="color:#00695C;text-decoration:none;">Forgot Password?</a>
        </div>

    </form>

</div>

</body>

</html>
