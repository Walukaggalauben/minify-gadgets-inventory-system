<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MINIFY GADGETS ERP V2</title>
    <style>
        *{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}
        body{margin:0;background:#f4f6f9;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .card{width:430px;max-width:100%;background:#fff;border-radius:15px;padding:38px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
        h1{text-align:center;color:#00695C;margin:0 0 8px}
        p{text-align:center;color:#6b7280;line-height:1.5}
        label{font-weight:600;display:block;margin:22px 0 8px}
        input{width:100%;padding:12px;border:1px solid #ced4da;border-radius:8px;font-size:15px}
        button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:#00695C;color:#fff;font-size:16px;cursor:pointer}
        .flash{padding:12px;border-radius:8px;background:#ffebee;color:#b71c1c;margin:18px 0}
        .hint{font-size:13px;color:#6b7280;margin-top:8px}
    </style>
</head>
<body>
<div class="card">
    <h1>MINIFY GADGETS</h1>
    <p>Create a new password for your ERP account.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">New Password</label>
        <input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required>
        <div class="hint">Use at least 8 characters.</div>

        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>

        <button type="submit">Set New Password</button>
    </form>
</div>
</body>
</html>
