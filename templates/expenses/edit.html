{% extends "layout.html" %}

{% block title %}Edit Expense{% endblock %}

{% block page_title %}Edit Expense{% endblock %}

{% block content %}

<div class="container-fluid py-3">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="fas fa-pen-to-square text-success me-2"></i>
                Edit Expense
            </h2>

            <p class="text-muted mb-0">
                Update the details of this business expense.
            </p>
        </div>

        <a
            href="{{ url_for('expenses.index') }}"
            class="btn btn-outline-secondary"
        >
            <i class="fas fa-arrow-left me-2"></i>
            Back to Expenses
        </a>

    </div>


    <div class="row justify-content-center">

        <div class="col-12 col-xl-9">

            <div class="erp-panel">

                <div class="erp-panel-header">

                    <div>
                        <h5 class="mb-1">
                            Expense Details
                        </h5>

                        <small class="text-muted">
                            {{ expense.expense_number }}
                        </small>
                    </div>

                </div>


                <div class="erp-panel-body">

                    <form
                        method="POST"
                        action="{{ url_for('expenses.edit', id=expense.id) }}"
                    >

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Expense Date
                                </label>

                                <input
                                    type="date"
                                    name="expense_date"
                                    class="form-control"
                                    value="{{ expense.expense_date.strftime('%Y-%m-%d') }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Category
                                </label>

                                <input
                                    type="text"
                                    name="category"
                                    class="form-control"
                                    value="{{ expense.category }}"
                                    placeholder="Rent, Utilities, Transport..."
                                    required
                                >

                            </div>


                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Description
                                </label>

                                <input
                                    type="text"
                                    name="description"
                                    class="form-control"
                                    value="{{ expense.description }}"
                                    placeholder="Describe the expense"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Amount (UGX)
                                </label>

                                <input
                                    type="number"
                                    name="amount"
                                    class="form-control"
                                    value="{{ expense.amount }}"
                                    min="0.01"
                                    step="0.01"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Payment Method
                                </label>

                                <select
                                    name="payment_method"
                                    class="form-select"
                                >

                                    {% for method in [
                                        "Cash",
                                        "Mobile Money",
                                        "Bank",
                                        "Card",
                                        "Other"
                                    ] %}

                                        <option
                                            value="{{ method }}"
                                            {% if expense.payment_method == method %}
                                                selected
                                            {% endif %}
                                        >
                                            {{ method }}
                                        </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Reference
                                    <span class="text-muted fw-normal">
                                        (Optional)
                                    </span>
                                </label>

                                <input
                                    type="text"
                                    name="reference"
                                    class="form-control"
                                    value="{{ expense.reference or '' }}"
                                    placeholder="Receipt number, transaction ID..."
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Notes
                                    <span class="text-muted fw-normal">
                                        (Optional)
                                    </span>
                                </label>

                                <textarea
                                    name="notes"
                                    class="form-control"
                                    rows="1"
                                    placeholder="Additional notes..."
                                >{{ expense.notes or '' }}</textarea>

                            </div>

                        </div>


                        <hr class="my-4">


                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{{ url_for('expenses.index') }}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                <i class="fas fa-save me-2"></i>
                                Update Expense
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
