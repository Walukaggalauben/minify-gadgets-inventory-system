{% extends "layout.html" %}

{% block title %}Edit Brand{% endblock %}

{% block page_title %}Edit Brand{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Brand Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="name"
                    value="{{ brand.name }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Logo URL
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="logo"
                    value="{{ brand.logo }}"
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description
                </label>

                <textarea
                    class="form-control"
                    name="description"
                    rows="4"
                >{{ brand.description }}</textarea>

            </div>

            <button class="btn btn-primary">

                <i class="fas fa-save"></i>

                Update Brand

            </button>

            <a href="{{ url_for('brand.index') }}"
               class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
