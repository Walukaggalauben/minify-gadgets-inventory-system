{% extends "layout.html" %}

{% block title %}Create Category{% endblock %}

{% block page_title %}Create Category{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">Category Name</label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">Description</label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                ></textarea>

            </div>

            <button class="btn btn-success">
                <i class="fas fa-save"></i>
                Save Category
            </button>

            <a href="{{ url_for('category.index') }}"
               class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
