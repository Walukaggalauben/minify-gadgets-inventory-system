{% extends "layout.html" %}

{% block title %}Edit Customer{% endblock %}

{% block page_title %}Edit Customer{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-warning text-dark">

                <h5 class="mb-0">

                    <i class="fas fa-user-edit"></i>

                    Edit Customer

                </h5>

            </div>

            <div class="card-body">

                <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name *

                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                value="{{ customer.full_name }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone *

                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ customer.phone }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Alternative Phone

                            </label>

                            <input
                                type="text"
                                name="alternative_phone"
                                class="form-control"
                                value="{{ customer.alternative_phone or '' }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ customer.email or '' }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                National ID

                            </label>

                            <input
                                type="text"
                                name="national_id"
                                class="form-control"
                                value="{{ customer.national_id or '' }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Business Name

                            </label>

                            <input
                                type="text"
                                name="business_name"
                                class="form-control"
                                value="{{ customer.business_name or '' }}">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Customer Type

                            </label>

                            <select
                                name="customer_type"
                                class="form-select">

                                <option value="Retail"
                                    {% if customer.customer_type=="Retail" %}selected{% endif %}>
                                    Retail
                                </option>

                                <option value="Wholesale"
                                    {% if customer.customer_type=="Wholesale" %}selected{% endif %}>
                                    Wholesale
                                </option>

                                <option value="Corporate"
                                    {% if customer.customer_type=="Corporate" %}selected{% endif %}>
                                    Corporate
                                </option>

                                <option value="VIP"
                                    {% if customer.customer_type=="VIP" %}selected{% endif %}>
                                    VIP
                                </option>

                            </select>

                        </div>

                        <div class="col-md-12 mb-3">

                            <label class="form-label">

                                Address

                            </label>

                            <textarea
                                name="address"
                                rows="3"
                                class="form-control">{{ customer.address or '' }}</textarea>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">

                        <a
                            href="{{ url_for('customer.view', id=customer.id) }}"
                            class="btn btn-secondary me-2">

                            Cancel

                        </a>

                        <button
                            class="btn btn-warning">

                            <i class="fas fa-save"></i>

                            Update Customer

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
