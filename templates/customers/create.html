{% extends "layout.html" %}

{% block title %}Add Customer{% endblock %}

{% block page_title %}New Customer{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-success text-white">

                <h5 class="mb-0">

                    <i class="fas fa-user-plus"></i>

                    Register New Customer

                </h5>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name *

                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone *

                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Alternative Phone

                            </label>

                            <input
                                type="text"
                                name="alternative_phone"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                National ID

                            </label>

                            <input
                                type="text"
                                name="national_id"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Business Name

                            </label>

                            <input
                                type="text"
                                name="business_name"
                                class="form-control">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Customer Type

                            </label>

                            <select
                                name="customer_type"
                                class="form-select">

                                <option>Retail</option>
                                <option>Wholesale</option>
                                <option>Corporate</option>
                                <option>VIP</option>

                            </select>

                        </div>

                        <div class="col-md-12 mb-3">

                            <label class="form-label">

                                Address

                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="3"></textarea>

                        </div>

                    </div>

                    <hr>

                    <div class="d-flex justify-content-end">

                        <a
                            href="{{ url_for('customer.index') }}"
                            class="btn btn-secondary me-2">

                            Cancel

                        </a>

                        <button
                            class="btn btn-success">

                            <i class="fas fa-save"></i>

                            Save Customer

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
