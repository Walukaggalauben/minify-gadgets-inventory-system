{% extends "layout.html" %}

{% block title %}Edit Product Variant{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Edit Product Variant
            </h3>

            <small class="text-muted">
                Update variant details, pricing and stock information.
            </small>
        </div>

        <a href="{{ url_for('variant.index') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            Back to Variants

        </a>

    </div>


    <div class="card shadow">

        <div class="card-header">
            <h4 class="mb-0">
                Variant Details
            </h4>
        </div>


        <div class="card-body">

            <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- PRODUCT + SKU -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Product
                        </label>

                        <select
                            name="product_id"
                            class="form-select"
                            required>

                            <option value="">
                                Select Product
                            </option>

                            {% for product in products %}

                            <option
                                value="{{ product.id }}"
                                {% if variant.product_id == product.id %}
                                    selected
                                {% endif %}>

                                {{ product.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            SKU
                        </label>

                        <input
                            type="text"
                            name="sku"
                            class="form-control"
                            value="{{ variant.sku or '' }}"
                            required>

                    </div>

                </div>


                <!-- BARCODE / STORAGE / RAM -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Barcode
                        </label>

                        <input
                            type="text"
                            name="barcode"
                            class="form-control"
                            value="{{ variant.barcode or '' }}">

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            Storage
                        </label>

                        <input
                            type="text"
                            name="storage"
                            class="form-control"
                            value="{{ variant.storage or '' }}"
                            placeholder="256GB">

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label">
                            RAM
                        </label>

                        <input
                            type="text"
                            name="ram"
                            class="form-control"
                            value="{{ variant.ram or '' }}"
                            placeholder="8GB">

                    </div>

                </div>


                <!-- COLOUR / CONDITION / QUANTITY -->
                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Colour
                        </label>

                        <input
                            type="text"
                            name="colour"
                            class="form-control"
                            value="{{ variant.colour or '' }}"
                            placeholder="Black">

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Condition
                        </label>

                        <select
                            name="condition"
                            class="form-select">

                            <option
                                value="Brand New"
                                {% if variant.condition == "Brand New" %}
                                    selected
                                {% endif %}>
                                Brand New
                            </option>

                            <option
                                value="Refurbished"
                                {% if variant.condition == "Refurbished" %}
                                    selected
                                {% endif %}>
                                Refurbished
                            </option>

                            <option
                                value="Used GradeA"
                                {% if variant.condition == "Used GradeA" %}
                                    selected
                                {% endif %}>
                                Used Grade A
                            </option>

                            <option
                                value="Used GradeB"
                                {% if variant.condition == "Used GradeB" %}
                                    selected
                                {% endif %}>
                                Used Grade B
                            </option>

                        </select>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="{{ variant.quantity or 0 }}"
                            min="0"
                            required>

                    </div>

                </div>


                <!-- PRICES -->
                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Buying Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="buying_price"
                            class="form-control"
                            value="{{ variant.buying_price or 0 }}"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Selling Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="selling_price"
                            class="form-control"
                            value="{{ variant.selling_price or 0 }}"
                            required>

                    </div>


                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Minimum Stock
                        </label>

                        <input
                            type="number"
                            name="minimum_stock"
                            class="form-control"
                            value="{{ variant.minimum_stock if variant.minimum_stock is not none else settings.default_minimum_stock }}"
                            min="0"
                            required>

                        <small class="text-muted">
                            Stock level at which the system should show a low-stock warning.
                        </small>

                    </div>

                </div>


                <!-- WARRANTY / IMAGE -->
                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Warranty (Months)
                        </label>

                        <input
                            type="number"
                            name="warranty_months"
                            class="form-control"
                            value="{{ variant.warranty_months if variant.warranty_months is not none else 12 }}"
                            min="0">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Image
                        </label>

                        <input
                            type="text"
                            name="image"
                            class="form-control"
                            value="{{ variant.image or '' }}"
                            placeholder="Optional image filename">

                    </div>

                </div>


                <!-- ACTIONS -->
                <div class="mt-3">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fas fa-save"></i>
                        Save Changes

                    </button>


                    <a
                        href="{{ url_for('variant.index') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
