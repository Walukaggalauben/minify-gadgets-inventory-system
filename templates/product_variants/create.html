{% extends "layout.html" %}

{% block title %}Add Product Variant{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header">
            <h4>Add Product Variant</h4>
        </div>

        <div class="card-body">

            <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Product</label>

                        <select
                            name="product_id"
                            class="form-select"
                            required>

                            <option value="">Select Product</option>

                            {% for product in products %}

                            <option value="{{ product.id }}">
                                {{ product.name }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">SKU</label>

                        <input
                            type="text"
                            name="sku"
                            class="form-control"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Barcode</label>

                        <input
                            type="text"
                            name="barcode"
                            class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Storage</label>

                        <input
                            type="text"
                            name="storage"
                            class="form-control"
                            placeholder="256GB">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">RAM</label>

                        <input
                            type="text"
                            name="ram"
                            class="form-control"
                            placeholder="8GB">

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Colour</label>

                        <input
                            type="text"
                            name="colour"
                            class="form-control"
                            placeholder="Black">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Condition</label>

                        <select
                            name="condition"
                            class="form-select">

                            <option value="Brand New">
                                Brand New
                            </option>

                            <option value="Refurbished">
                                Refurbished
                            </option>

                            <option value="Used Grade A">
                                Used Grade A
                            </option>

                            <option value="Used Grade B">
                                Used Grade B
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Quantity
                        </label>

                        <input
                            type="number"
                            name="quantity"
                            class="form-control"
                            value="0"
                            min="0"
                            required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Buying Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="buying_price"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Selling Price
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            name="selling_price"
                            class="form-control"
                            required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Minimum Stock
                        </label>

                        <input
                            type="number"
                            name="minimum_stock"
                            class="form-control"
                            min="0"
                            value="{{ settings.default_minimum_stock }}"
                            required>

                        <small class="text-muted">
                            Default value comes from System Settings.
                        </small>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Warranty (Months)
                        </label>

                        <input
                            type="number"
                            name="warranty_months"
                            class="form-control"
                            value="12"
                            min="0">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Image
                        </label>

                        <input
                            type="text"
                            name="image"
                            class="form-control"
                            placeholder="Optional image filename">

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="fas fa-save"></i>

                    Save Variant

                </button>

                <a
                    href="{{ url_for('variant.index') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
