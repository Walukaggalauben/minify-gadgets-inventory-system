{% extends "layout.html" %}

{% block title %}Edit Supplier{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card shadow">

<div class="card-header">

<h4>Edit Supplier</h4>

</div>

<div class="card-body">

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
value="{{ supplier.name }}"
required>

</div>

<div class="mb-3">

<label>Contact Person</label>

<input
type="text"
name="contact_person"
class="form-control"
value="{{ supplier.contact_person or '' }}">

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control"
value="{{ supplier.phone or '' }}">

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
value="{{ supplier.email or '' }}">

</div>

<div class="mb-3">

<label>Address</label>

<textarea
name="address"
rows="3"
class="form-control">{{ supplier.address or '' }}</textarea>

</div>

<div class="mb-3">

<label>Notes</label>

<textarea
name="notes"
rows="3"
class="form-control">{{ supplier.notes or '' }}</textarea>

</div>

<button class="btn btn-primary">

<i class="fas fa-save"></i>

Update Supplier

</button>

<a
href="{{ url_for('supplier.index') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
