{% extends "layout.html" %}

{% block title %}Add Supplier{% endblock %}

{% block content %}

<div class="container-fluid">

<div class="card shadow">

<div class="card-header">

<h4>Add Supplier</h4>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Contact Person</label>

<input
type="text"
name="contact_person"
class="form-control">

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
name="phone"
class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control">

</div>

<div class="mb-3">

<label>Address</label>

<textarea
name="address"
rows="3"
class="form-control"></textarea>

</div>

<div class="mb-3">

<label>Notes</label>

<textarea
name="notes"
rows="3"
class="form-control"></textarea>

</div>

<button class="btn btn-primary">

<i class="fas fa-save"></i>

Save Supplier

</button>

<a
href="{{ url_for('supplier.index') }}"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

{% endblock %}
